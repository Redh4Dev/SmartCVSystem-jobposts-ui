{% extends "base.html" %}
{% block title %}Reset Password | {{ site_name }}{% endblock %}
{% block content %}
<h2>Reset your password</h2>
<p>Enter your email and we’ll send you a link to reset it.</p>
<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}<br>
  <button type="submit" class="btn btn-primary mt-2">Send reset link</button>
</form>
{% endblock %}
